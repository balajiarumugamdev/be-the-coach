# Builds the Leaps Up app (in /app) and publishes it to GitHub Pages on every push to main.
# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy Leaps Up to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & build (app/)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Copy standalone guides into the site
        run: cp docs/teacher-form-training/*.html app/dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
