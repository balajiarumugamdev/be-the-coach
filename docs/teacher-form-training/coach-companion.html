<title>Coach Teaching Guide — Building a Teacher-Info App with Claude</title>
<style>
  :root{

    --text:#1f2328; --muted:#656d76; --accent:#0969da; --accent2:#1a7f37;

  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.62;}

  .btn.primary:hover{background:#0860c8;}

  @media(max-width:860px){.layout{grid-template-columns:1fr;}}
  nav{border-right:1px solid var(--border);background:var(--panel);min-height:calc(100vh - 66px);padding:14px 10px;position:sticky;top:66px;max-height:calc(100vh - 66px);overflow-y:auto;}

  .content h2{font-size:1.55rem;margin:0 0 .2rem;}
  .content h3{font-size:1.1rem;margin:1.5rem 0 .4rem;color:#0b3d78;}
  .content p{margin:.6rem 0;}
  .content ul,.content ol{margin:.5rem 0;padding-left:1.4rem;}
  .content li{margin:.32rem 0;}

  .lead{font-size:1.02rem;background:var(--panel2);border-radius:.5rem;padding:.7rem .95rem;margin:.5rem 0 1rem;}
  .lead b{color:#0b3d78;}

const MODULES = [
  {
    id:"how-to-teach",

    html:`
      <span class="kicker">For the coach</span>
      <h2>How to teach this over Teams</h2>
      <p class="lead">This guide is your <b>teaching script</b>. Each section gives you the
      <b>What</b>, <b>Why</b> and <b>How</b> so you can explain confidently — plus 🗣️ talking points to

      <h3>How each section is laid out</h3>

        <li><b>What it is</b> — the plain explanation to give.</li>

      <h3>Running the session on Teams</h3>
      <ul>
        <li><b>Share your screen and do it live</b> — build the same app yourself as you narrate. Seeing it happen beats slides.</li>
        <li><b>Have interns follow along</b> on their own machine, one step behind you. Pause at each ✅ checkpoint and ask "is everyone seeing this?"</li>
        <li><b>Teach the loop, not the keystrokes</b> — the goal is that they can direct Claude, not memorise commands.</li>
        <li><b>Record the session</b> so interns can rewatch tricky parts (installs, Microsoft setup).</li>
        <li><b>Park the stragglers</b> — if one person is stuck, note it and help after, so the group keeps moving.</li>
      </ul>
      <div class="callout coach"><span class="h">👩‍🏫 Pacing</span>
      This is roughly 3 short sessions: (1) setup + version control + tech + create project, (2) build the

    `
  },
  {
    id:"orientation",
    title:"1 · Orientation — the big idea",
    html:`
      <h2>Orientation — the big idea</h2>
      <p class="lead"><b>What they'll build:</b> a real web app where a teacher signs in with Microsoft,
      fills in a form, and each submission lands as a row in an Excel sheet on OneDrive — built
      <b>without the intern writing any code.</b></p>
      <h3>The one idea to land first</h3>
      <p><b>What:</b> They are not learning to write code. They're learning to <b>direct Claude</b> to write
      it. Their real skill is describing what they want clearly and steering the result.</p>
      <p><b>Why it matters:</b> If interns think "I can't code, so I can't do this," they'll freeze. Reframe it:
      "You're the director; Claude is the builder." That mindset is the whole course.</p>
      <p><b>How they'll work — the four-step loop:</b></p>
      <ol>
        <li><b>Describe</b> what you want.</li>
        <li>Let Claude <b>build</b> it.</li>
        <li><b>Run</b> it.</li>
        <li>If it breaks, <b>paste the error back</b> to Claude.</li>
      </ol>
      <div class="callout say"><span class="h">🗣️ Say to the intern</span>
      "You don't need to understand every line. Your job is to explain clearly, run what Claude gives you,
      and tell it what happened. Errors are normal — pasting them back is how we make progress."</div>
      <h3>The journey (show them the map)</h3>
      <p>Set up tools → put the project under version control → choose the tech → create the React project →

    `
  },
  {
    id:"accounts",
    title:"2 · Accounts you'll need",
    html:`
      <h2>Accounts you'll need</h2>
      <p class="lead"><b>What:</b> four free accounts. <b>Why:</b> each plays one clear role — worth naming so
      interns aren't confused later about "which login is this?"</p>
      <table>
        <tr><th>Account</th><th>What it's for (say this)</th></tr>
        <tr><td><b>Claude</b></td><td>The assistant that writes your code.</td></tr>
        <tr><td><b>GitHub</b></td><td>The online home + backup of your code — and what publishes it later.</td></tr>
        <tr><td><b>Microsoft 365</b> (work)</td><td>Signs the teacher in, and where the Excel data is saved.</td></tr>
        <tr><td><b>Vercel</b> (later)</td><td>Puts the finished app on the internet. You'll sign up with GitHub.</td></tr>
      </table>
      <div class="callout coach"><span class="h">👩‍🏫 Coach note</span>
      Confirm before the session that interns can sign in to Claude and GitHub and that their M365 account
      works. Also check whether they can register an app in Entra ID — if not, plan to help at Parts 12 & 14.</div>
    `
  },
  {
    id:"install",
    title:"3 · Install the tools",
    html:`
      <h2>Install the tools (~20 min)</h2>
      <p class="lead"><b>What:</b> three programs. <b>Why:</b> together they let the intern build and run a
      real app on their own machine, with Claude helping inside.</p>
      <h3>1) VS Code — <span style="font-weight:400">what & why</span></h3>
      <p><b>What:</b> the workspace where the project's files live and where you run things. <b>Why:</b> it's
      where Claude will live too, so everything is in one window. <b>How:</b> code.visualstudio.com → install.</p>
      <h3>2) Node.js — <span style="font-weight:400">what & why</span></h3>
      <p><b>What:</b> the engine that runs the app on your computer. <b>Why:</b> React's tools need it (you'll
      explain this more in "Choosing your tech"). <b>How:</b> nodejs.org → the big <b>LTS</b> button → install.</p>
      <div class="callout check"><span class="h">✅ Checkpoint (do this live)</span>
      VS Code menu <b>Terminal → New Terminal</b>, type <code>node --version</code>. Seeing <code>v20.x.x</code>
      proves Node is installed. "not recognised" → close &amp; reopen VS Code.</div>
      <h3>3) Claude Code extension — <span style="font-weight:400">what & why</span></h3>
      <p><b>What:</b> Claude living inside VS Code, able to create files and run commands. <b>Why:</b> this is
      what makes "build with prompts only" possible — Claude does the typing. <b>How:</b> Extensions icon →
      search "Claude Code" → Install (Anthropic) → open the Claude panel → sign in.</p>
      <div class="callout coach"><span class="h">👩‍🏫 Coach note</span>
      Installs are where non-technical people stall. Do them live, screen-shared, and wait for every intern's
      ✅ before moving on. Common snag: Node "not recognised" until VS Code is restarted.</div>
    `
  },
  {
    id:"working-with-claude",
    title:"4 · Working with Claude",
    html:`
      <h2>Working with Claude (the core skill)</h2>
      <p class="lead"><b>What:</b> how to talk to Claude so it produces good work. <b>Why:</b> this is the
      single most transferable skill in the whole course — spend real time here.</p>
      <h3>How it works in VS Code</h3>
      <ul>
        <li>Type into the <b>Claude panel</b>; Claude replies and <b>creates/edits files</b> (approve its prompts).</li>
        <li>Claude <b>runs commands in the bottom terminal</b> — the intern doesn't type them.</li>
        <li>Red error? Copy it, paste to Claude, ask how to fix it.</li>
      </ul>
      <h3>Five habits — teach each with the "why"</h3>
      <table>
        <tr><th>Habit</th><th>Why it works</th></tr>
        <tr><td><b>Give context</b> ("I'm a beginner building X")</td><td>Claude tailors depth and tone to them.</td></tr>
        <tr><td><b>One thing at a time</b></td><td>Small changes are easy to check and undo; big vague asks get messy.</td></tr>
        <tr><td><b>Ask it to explain</b></td><td>Builds understanding and catches misunderstandings early.</td></tr>
        <tr><td><b>Ask for a plan before big changes</b></td><td>You approve the approach before any code changes.</td></tr>
        <tr><td><b>You're the boss</b></td><td>Interns should question odd output, not rubber-stamp it.</td></tr>
      </table>
      <div class="callout say"><span class="h">🗣️ Say to the intern</span>
      "A vague prompt gets a vague result. Tell Claude who you are, what you want, and what to do next —
      then check what it did."</div>

      <h3>Vague vs specific — the same request, two ways</h3>
      <p>Show interns both. The first leaves every decision to Claude (and it guesses); the second tells it
      who, what, and what "done" looks like.</p>
      <div class="promptbox"><div class="label">👎 Vague prompt</div>
      "Make a form for teachers."</div>
      <div class="promptbox"><div class="label">👍 Specific prompt</div>
      "I'm a beginner. Build a simple form that collects a teacher's <b>full name, email, subject, and years
      of experience</b>. Make email <b>required and validated</b>. On submit, show a <b>"Thank you, saved!"</b>
      message. Keep the layout clean and simple, and explain what you changed after."</div>
      <table>
        <tr><th>The vague one leaves open…</th><th>The specific one decides…</th></tr>
        <tr><td>Which fields? Required or not?</td><td>Four named fields; email required + validated</td></tr>
        <tr><td>What happens on submit?</td><td>Shows "Thank you, saved!"</td></tr>
        <tr><td>How should it look? Who's it for?</td><td>Clean &amp; simple; built for a beginner, with an explanation</td></tr>
      </table>
      <div class="callout say"><span class="h">🗣️ Say to the intern</span>
      "Every decision you don't make, Claude makes for you — and it has to guess. The specific prompt gets you
      what <em>you</em> pictured on the first try."</div>

      <div class="qa"><span class="q">❓ "What if Claude does something I didn't ask for?"</span>
      <span class="a">Tell it: 'that's not what I wanted — undo that and do X instead.' You're always in control.</span></div>
      <div class="callout coach"><span class="h">👩‍🏫 Coach note</span>
      Demonstrate a bad prompt vs a good prompt live and show the difference in output. It lands instantly.</div>
    `
  },
  {
    id:"claude-essentials",
    title:"Claude essentials: context, CLAUDE.md & skills",
    html:`
      <h2>Claude essentials: context, CLAUDE.md & skills</h2>
      <p class="lead"><b>Why this is the most important module:</b> the whole course is "direct Claude well."
      These few ideas separate someone who fights Claude from someone who flies with it. Teach them slowly.</p>

      <h3>1) Context — what Claude can "see"</h3>
      <p><b>What:</b> Claude works from its <b>context</b> — the current conversation plus the files it's been
      shown. It doesn't magically know your whole computer; it knows what's in front of it right now.</p>
      <p><b>Why it matters:</b> if something important isn't in the context, Claude can't use it. And if a chat
      runs very long, older details get crowded out or summarised. Good results come from the <em>right</em>
      context, not the most.</p>
      <p><b>How to manage it:</b></p>
      <ul>
        <li>Point Claude at the relevant file(s) when you ask about them.</li>
        <li>Start a <b>fresh chat</b> for a new, unrelated task (<code>/clear</code>) so old context doesn't confuse it.</li>
        <li>Re-state key facts if the conversation has gone long.</li>
      </ul>
      <div class="callout say"><span class="h">🗣️ Say to the intern</span>
      "Claude only knows what's in the conversation right now. If it seems to 'forget', remind it — or start a
      fresh chat for a new task."</div>
      <div class="qa"><span class="q">❓ "Does Claude remember everything from yesterday?"</span>
      <span class="a">Not automatically. For things it should <em>always</em> know about your project, we use a CLAUDE.md file — next.</span></div>

      <h3>2) Tokens &amp; the context window — how much Claude can hold at once</h3>
      <p><b>What is a token:</b> a <b>token</b> is a small chunk of text — very roughly a word or a
      piece of a word (about 4 characters, so ~¾ of a word on average). Claude doesn't read letters one
      by one; it reads and writes in tokens. "Building a form" is a handful of tokens; a whole file might
      be hundreds or thousands. Everything you type and everything Claude replies is counted in tokens.</p>
      <p><b>What is the context window:</b> the <b>context window</b> is the <em>total amount of tokens
      Claude can keep in mind at one time</em> — your conversation so far, plus the files it's been shown,
      plus its own replies. Think of it as the size of Claude's desk: big, but not infinite. When the desk
      fills up, the oldest papers get pushed off the edge — that's why very long chats start to "forget"
      early details.</p>
      <p><b>Why it matters:</b> this is the mechanical reason behind the Context rule above. A fresh chat
      is an empty desk (full window free); a long, sprawling chat is a cluttered desk where important facts
      compete for space. You get better answers by keeping the window focused on what's relevant.</p>
      <p><b>How to manage it:</b></p>
      <ul>
        <li>Start a <b>fresh chat</b> (<code>/clear</code>) for a new task — empties the desk.</li>
        <li>Show Claude <b>only the files that matter</b> for the current question, not everything.</li>
        <li>Put always-needed facts in <b>CLAUDE.md</b> (next) so they don't eat up the window each time.</li>
      </ul>
      <div class="callout say"><span class="h">🗣️ Analogy to say</span>
      "A token is a chunk of text; the context window is Claude's desk. It's roomy but not endless — when it
      fills up, the oldest stuff falls off. Keep the desk tidy and Claude stays sharp."</div>
      <div class="qa"><span class="q">❓ "Do I need to count tokens?"</span>
      <span class="a">No — you never count them by hand. Just know the window is finite: start fresh for
      new tasks and don't dump in files you don't need.</span></div>

      <h3>3) CLAUDE.md — your project's memory</h3>
      <p><b>What:</b> a plain file named <code>CLAUDE.md</code> in your project that Claude Code <b>reads
      automatically every time it starts.</b> It's where you write what Claude should always know: what the
      project is, how to run and test it, conventions, and any "always do / never do" rules.</p>
      <p><b>Why:</b> so you don't re-explain your project every session. It's <em>persistent</em> context —
      write it once, Claude honours it every time.</p>
      <p><b>How:</b> run <code>/init</code> in Claude Code to generate a starter one, or ask
      <em>"create a CLAUDE.md describing this project and how to run it."</em> Update it as the project grows.</p>
      <p><b>What ours might say:</b> "React + Vite app that collects teacher info and saves it to Excel via
      Microsoft Graph. Run with <code>npm run dev</code>, test with <code>npm test</code>. Keep the UI simple.
      Never commit secrets."</p>
      <div class="callout say"><span class="h">🗣️ Analogy to say</span>
      "CLAUDE.md is an onboarding note Claude reads before every shift — put the project's ground rules there
      once, and you never repeat them."</div>

      <h3>4) Skills — reusable know-how</h3>
      <p><b>What:</b> a <b>Skill</b> is a saved packet of instructions/steps Claude pulls in <em>when it's
      relevant</em>. Where CLAUDE.md is <em>always</em> loaded, a skill loads <em>on demand</em> for a specific
      kind of task.</p>
      <table>
        <tr><th></th><th>CLAUDE.md</th><th>Skill</th></tr>
        <tr><td><b>Loaded</b></td><td>Always (project context)</td><td>When relevant / when invoked</td></tr>
        <tr><td><b>Scope</b></td><td>This project's ground rules</td><td>A specific repeatable task or know-how</td></tr>
        <tr><td><b>Good for</b></td><td>"How this project works"</td><td>"How we do X, step by step"</td></tr>
      </table>
      <p><b>When to CREATE a new skill:</b> you notice you're giving the <em>same multi-step instructions</em>
      again and again — e.g. "how we add a new form field end to end", "our deployment checklist", "our house
      style for forms". Capture it once as a skill.</p>
      <p><b>When to USE an existing skill:</b> when your task matches a skill you (or your team) already made —
      don't rebuild it. Check what skills exist before writing fresh instructions.</p>
      <p><b>How:</b> ask Claude — <em>"help me turn these repeated steps into a Claude Code skill, and tell me
      where it's saved."</em> It creates a small <code>SKILL.md</code> with a name and a description of when to use it.</p>
      <div class="callout say"><span class="h">🗣️ Say to the intern</span>
      "If you've explained the same thing three times, make it a skill. If a skill already covers your task, use
      it — don't reinvent it."</div>
      <div class="qa"><span class="q">❓ "Skill or CLAUDE.md — which do I use?"</span>
      <span class="a">Always-true project facts → CLAUDE.md. A specific repeatable procedure you trigger
      sometimes → a skill.</span></div>

      <h3>5) A few more concepts that pay off</h3>
      <ul>
        <li><b>Plan before big changes</b> — "show me your plan first"; you approve the approach before any code changes.</li>
        <li><b>Be specific and iterative</b> — small, clear asks beat one giant vague one.</li>

        <li><b>Save often (Git)</b> — commit after each working step so you can always rewind.</li>

      <h2>Version control (Git & GitHub)</h2>
      <p class="lead"><b>What:</b> a system of "save points" for your whole project. <b>Why:</b> so a bad
      change is never a disaster — you rewind. We set it up <b>first</b> so everything from here is saved, and

      <h3>Git vs GitHub — explain the difference clearly</h3>
      <ul>
        <li><b>Git</b> = save points <em>on your computer</em>. Rewind to any version that worked.</li>
        <li><b>GitHub</b> = the <em>online</em> copy of those save points — a backup, a way to share, and what Vercel deploys from.</li>
      </ul>
      <div class="callout say"><span class="h">🗣️ Analogy to say</span>
      "Git is like saving a document with full history — you can open any past version. GitHub is keeping that
      document in the cloud so it's backed up and shareable."</div>
      <h3>How: create the repo & link it</h3>
      <ol>
        <li>github.com → <b>New</b> → name <code>teacher-form</code> → <b>Private</b> → Create. Copy the URL.</li>
        <li>In VS Code, open the project folder, then have Claude connect it:</li>
      </ol>
      <div class="promptbox"><div class="label">Say to Claude</div>
      "Set up Git in this project and connect it to my GitHub repository at PASTE-URL. I'm a beginner — do the
      steps and tell me if I need to sign in to GitHub. We'll make the first real commit after we create the app."</div>
      <h3>The Git commands — what Claude runs, and what they mean</h3>
      <p>Interns won't type these, but teach what they mean so it's not magic. The everyday flow is
      <b>add → commit → push</b>.</p>
      <table>
        <tr><th>Command</th><th>What it does</th><th>Analogy</th></tr>
        <tr><td><code>git init</code></td><td>Start tracking this project (once)</td><td>Open a fresh logbook</td></tr>
        <tr><td><code>git status</code></td><td>Show what changed since the last save</td><td>Check what's new on your desk</td></tr>
        <tr><td><code>git add .</code></td><td><b>Stage</b> changes for the next save</td><td>Put items into a box</td></tr>
        <tr><td><code>git commit -m "msg"</code></td><td><b>Save</b> a snapshot with a label</td><td>Seal &amp; label the box</td></tr>
        <tr><td><code>git push</code></td><td>Upload commits to GitHub</td><td>Ship the box to the warehouse</td></tr>
        <tr><td><code>git pull</code></td><td>Download changes from GitHub</td><td>Collect boxes from the warehouse</td></tr>
        <tr><td><code>git log</code></td><td>List past commits (history)</td><td>Flip through the logbook</td></tr>
        <tr><td><code>git remote add origin &lt;url&gt;</code></td><td>Link the project to the GitHub repo (once)</td><td>Note the warehouse address</td></tr>
        <tr><td><code>git revert</code> / <code>git checkout</code></td><td>Go back to an earlier state</td><td>Re-open an older box</td></tr>
      </table>
      <p><b>So "save my work" = <code>git add</code></b> (box up) → <b><code>git commit</code></b> (seal + label)
      → <b><code>git push</code></b> (send to GitHub).</p>
      <div class="callout say"><span class="h">🗣️ Habit to instil</span>
      "After anything works, say to Claude: 'commit and push my progress with a clear message.' To undo a mess:
      'take me back to the last working commit.'"</div>
      <div class="qa"><span class="q">❓ "Why bother if Claude can just rebuild it?"</span>
      <span class="a">Because a broken change can be hard to describe back. A save point is an instant, reliable rewind.</span></div>
      <div class="callout coach"><span class="h">👩‍🏫 Coach note</span>

    id:"spec-and-errors",
    title:"8 · Specs & handling errors",
    html:`
      <h2>Specs & handling errors</h2>
      <p class="lead"><b>Why together:</b> a good spec prevents many errors, and calm error-handling fixes the
      rest. These two habits make interns self-sufficient.</p>
      <h3>Write a specification first</h3>
      <p><b>What:</b> a short plain-English description of what you want, before building. <b>Why:</b> the
      clearer the ask, the better Claude's output — vague in, vague out. <b>How:</b> answer five questions —
      what it's for, who uses it &amp; how, what info it captures, the rules, what success looks like.</p>
      <div class="promptbox"><div class="label">Say to Claude</div>
      "Here's my rough idea: [paste your five answers]. Turn this into a clear, short specification and ask me
      about anything unclear before we build."</div>

      <h3>What a good spec actually looks like</h3>
      <p>Answer the five questions in plain English — no jargon needed. Here's a filled-in example for our
      teacher form that interns can copy the <em>shape</em> of:</p>
      <div class="promptbox"><div class="label">📄 Example specification — Teacher Info Form</div>
      <b>1. What it's for:</b> Collect basic details about a teacher and save them so the office has a record.<br>
      <b>2. Who uses it &amp; how:</b> A teacher opens the page, signs in with their Microsoft account, fills the
      form once, and submits.<br>
      <b>3. What info it captures:</b> Full name, email, subject taught, years of experience.<br>
      <b>4. The rules:</b>
        <ul style="margin:.3rem 0">
          <li>All fields are required.</li>
          <li>Email must be a valid email address.</li>
          <li>Years of experience must be a number of 0 or more.</li>
          <li>A teacher can only submit after signing in.</li>
        </ul>
      <b>5. What success looks like:</b> On a valid submit, the teacher sees "Thank you, saved!" and a new row
      is added to the Excel sheet with their answers. Invalid submits show a clear error and save nothing.</div>
      <p><b>Why this is good:</b> it's specific and testable — every rule is something you can later check —
      but it stays short and says <em>what</em>, not <em>how</em> (it doesn't dictate the code). Notice it names
      the exact success message and the exact fields, so there's nothing left to guess.</p>

      <h3>Link the spec to your tests</h3>
      <p><b>The key idea to teach:</b> the spec <em>defines what "correct" means</em> — so your test cases come
      straight from it. <b>Each rule in the spec becomes a test case.</b> (You'll write the actual tests later,
      but this is where they come from.)</p>
      <table>
        <tr><th>Spec rule</th><th>Becomes this test case</th></tr>
        <tr><td>Email is required</td><td>Submitting with an empty email shows an error</td></tr>
        <tr><td>Email must be valid</td><td>"abc" is rejected; "a@b.com" is accepted</td></tr>
        <tr><td>All fields are needed</td><td>Submitting an empty form is blocked</td></tr>
        <tr><td>Success = "Thank you, saved!" + a row in Excel</td><td>A valid submission shows the thank-you message</td></tr>
      </table>
      <div class="callout say"><span class="h">🗣️ Say to the intern</span>
      "Write the spec first, and testing becomes easy — you just turn each rule into a check. And here's a tip:
      if you can't write a test for a rule, the rule probably isn't clear enough yet."</div>
      <h3>When something breaks</h3>
      <p><b>What:</b> errors are normal messages telling you something's off. <b>Why teach a process:</b> panic
      and random changes make things worse; a calm loop fixes things.</p>
      <ol>
        <li>Don't panic; don't randomly change things.</li>
        <li>Read the last few lines.</li>
        <li>Copy the whole error to Claude with context (what you did, what you expected).</li>
        <li>Try the fix; a new error usually means progress — repeat.</li>
        <li>Undo anytime: "undo your last change" or rewind to the last commit.</li>
      </ol>
      <div class="callout warn"><span class="h">Do NOT</span>Delete files to "clean up", ignore errors, or paste
      passwords/secrets. (Client ID is fine; passwords &amp; client secrets are not.)</div>
      <div class="callout say"><span class="h">🗣️ Say to the intern</span>
      "An error isn't failure — it's information. Copy the whole thing and let Claude read it. Nine times out of
      ten that's the fix."</div>
      <div class="callout coach"><span class="h">👩‍🏫 Coach note</span>
      Escalation trigger: stop after 2–3 tries over ~15 min, or immediately for Microsoft sign-in/permission errors.</div>
    `

    id:"data-safety",

    html:`
      <h2>Handling real data safely</h2>
      <p class="lead"><b>Why now:</b> from here the app touches real accounts and real teacher information —
      set the ground rules before any real data is collected.</p>
      <h3>The rules — what & why</h3>
      <ul>
        <li><b>Never share secrets.</b> Client ID is fine; passwords, "client secrets", and <code>.env</code>
        contents must never be pasted anywhere public. <em>Why: a leaked secret lets someone impersonate the app.</em></li>
        <li><b>Keep secrets out of what's published.</b> They live in <code>.env</code>; <code>.gitignore</code>
        keeps that out of GitHub. <em>Why: pushing a secret to GitHub exposes it.</em></li>
        <li><b>Collect only what you need.</b> <em>Why: every field is personal data you're now responsible for.</em></li>
        <li><b>Treat submissions as confidential</b> — they're real people.</li>
        <li><b>If a secret leaks, tell the coach immediately</b> — it can be rotated.</li>
      </ul>
      <div class="callout say"><span class="h">🗣️ Say to the intern</span>
      "Rule of thumb: the Client ID is like a shop's name — public. A client secret or password is like the
      shop's keys — never hand them out."</div>
      <div class="callout coach"><span class="h">👩‍🏫 Coach note</span>
      If your org has GDPR/data-handling policies, brief interns here before real submissions are collected.</div>

  {
    id:"ms-concepts",
    title:"11 · Understand the Microsoft pieces",
    html:`
      <h2>Understand the Microsoft pieces</h2>
      <p class="lead"><b>Why spend time here:</b> this is where interns get lost. If they understand the
      concepts first, the clicking in the next parts makes sense instead of feeling random.</p>
      <p><b>The goal:</b> the app must (1) know who the teacher is (sign-in) and (2) be allowed to save to their
      files. Microsoft won't let a random app do either without an introduction and permission.</p>
      <h3>Microsoft Graph API</h3>
      <p><b>What:</b> one doorway to Microsoft 365 data — mail, Teams, OneDrive, Excel. <b>Why:</b> our app adds
      a row to Excel by asking Graph. <b>Analogy:</b> Graph is the <b>reception desk</b> for all M365 data — you
      make a request and it does it, if you're allowed.</p>
      <h3>Entra app registration</h3>
      <p><b>What:</b> registering the app so Microsoft knows and trusts it. <b>Why:</b> without it, every
      sign-in is rejected. <b>Analogy:</b> a contractor signs in at security and gets a <b>visitor badge</b>.</p>
      <h3>Tenant ID vs Client ID</h3>
      <table>
        <tr><th>ID</th><th>What it identifies</th><th>Analogy</th></tr>
        <tr><td><b>Tenant ID</b></td><td>Your <em>organisation</em> (whose users/data)</td><td>The building</td></tr>
        <tr><td><b>Client ID</b> (App ID)</td><td>Your <em>app</em> (which app is this)</td><td>The badge number</td></tr>
      </table>
      <p>A <b>client secret</b> is a password for <em>server</em> apps — a browser app usually needs none.</p>
      <h3>Permissions & the access token</h3>
      <p><b>Permissions/scopes</b> (e.g. <code>Files.ReadWrite</code>): what the app is <em>allowed</em> to do —
      must be consented to. <b>Access token:</b> a short-lived pass Microsoft gives the app after sign-in,
      proving the user is signed in and the app is allowed; shown to Graph on every request.</p>
      <pre><code>1. Register app in Entra ID -> Tenant ID + Client ID   (Register step)
2. App uses the IDs to start sign-in                   (Sign-in step)
3. Teacher signs in at Microsoft
4. Microsoft returns an access token
5. Permission (Files.ReadWrite) is consented           (Permissions step)
6. App calls Graph WITH the token -> row into Excel    (Save-data step)</code></pre>
      <div class="callout say"><span class="h">🗣️ Say to the intern</span>
      "Think of a secure office: the app registration is the visitor badge, sign-in proves who you are, the
      access token is a day-pass, permissions say which rooms you can enter, and Graph is the front desk that
      actually does things for you."</div>
      <div class="qa"><span class="q">❓ "Why so many steps just to save a row?"</span>
      <span class="a">Because it's real company data. Microsoft makes apps prove who they are and what they're
      allowed to do — that protects everyone's files.</span></div>
      <div class="callout coach"><span class="h">👩‍🏫 Coach note</span>
      Teach this <em>before</em> the clicking. When sign-in or saving fails later, point back to which link in
      the 6-step chain broke.</div>
    `

const KEY = "coach_companion_done_v4";
let current = 0;

function loadDone(){ try{ return new Set(JSON.parse(localStorage.getItem(KEY))||[]); }catch(e){ return new Set(); } }
function saveDone(set){ localStorage.setItem(KEY, JSON.stringify([...set])); }
let done = loadDone();

const nav = document.getElementById("nav");
const content = document.getElementById("content");
const pbar = document.getElementById("pbar");
const ppct = document.getElementById("ppct");
const doneBtn = document.getElementById("doneBtn");
const doneStatus = document.getElementById("doneStatus");

function renderNav(){
  nav.innerHTML = "";
  MODULES.forEach((m, i) => {
    const b = document.createElement("button");
    b.className = "navitem" + (i===current?" active":"") + (done.has(m.id)?" doneItem":"");
    b.innerHTML = '<span class="navnum">'+(i+1)+'</span><span class="tick">✓</span><span>'+m.title.replace(/^\d+\s*·\s*/,"")+'</span>';
    b.onclick = () => { current = i; render(); };
    nav.appendChild(b);
  });
}
function renderProgress(){
  const pct = Math.round((done.size / MODULES.length) * 100);
  pbar.style.width = pct + "%";
  ppct.textContent = pct + "% (" + done.size + "/" + MODULES.length + ")";
}
function render(){
  const m = MODULES[current];
  content.innerHTML = m.html;
  const isDone = done.has(m.id);
  doneBtn.textContent = isDone ? "✓ Done — click to undo" : "Mark this section done";
  doneBtn.className = "btn " + (isDone ? "done" : "primary");
  doneStatus.textContent = isDone ? "Marked complete." : "";
  renderNav();
  renderProgress();
  window.scrollTo({top:0, behavior:"smooth"});
}
doneBtn.onclick = () => {
  const id = MODULES[current].id;
  if(done.has(id)) done.delete(id); else done.add(id);
  saveDone(done);
  render();
};
document.getElementById("prevBtn").onclick = () => { if(current>0){current--; render();} };
document.getElementById("nextBtn").onclick = () => { if(current<MODULES.length-1){current++; render();} };
document.getElementById("resetBtn").onclick = () => {
  if(confirm("Clear all progress?")){ done = new Set(); saveDone(done); render(); }
};

render();
</script>
